name: keepalive
# 공개 레포는 60일간 활동이 없으면 예약 실행이 자동 정지됨 → 매달 빈 커밋으로 막음

on:
  schedule:
    - cron: "17 0 1 * *"      # 매달 1일 09:17 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name  "newswire-bot"
          git config user.email "newswire-bot@users.noreply.github.com"
          git commit --allow-empty -m "keepalive $(date -u +%F)"
          git push
